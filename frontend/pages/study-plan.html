<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1764a3">

    <title>Study Plan - Academic AI Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>

        <div class="logo">
            Academic AI Assistant
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="gpa.html">GPA</a></li>
            <li><a href="study-plan.html" class="active">Study Plan</a></li>
        </ul>

    </nav>

    <main class="page-container">

        <section class="page-header">

            <h1>Personalized Study Planner</h1>

            <p>
                Add multiple subjects, set your available time, and we'll create an integrated study plan.
            </p>

        </section>

        <section class="study-card">

            <h2>Add Subject</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="subject">Subject Name</label>
                    <input type="text" id="subject" placeholder="Example: Artificial Intelligence">
                </div>

                <div class="form-group">
                    <label for="examDate">Exam Date</label>
                    <input type="date" id="examDate">
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty">
                        <option value="">Select Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

            </div>

            <button type="button" id="addSubjectButton" class="primary-button">
                Add Subject
            </button>

        </section>
        
        <section class="study-card">

            <h2>Plan Settings</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label for="hours">Available Hours Per Day</label>
                    <input type="number" id="hours" min="1" max="24" placeholder="4">
                </div>

                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>
            </div>

            <button type="button" id="generateButton" class="primary-button">
                Generate Integrated Plan
            </button>

        </section>

        <section id="scheduleSection" class="schedule-card">

            <h2>Your Study Plan</h2>

            <div id="scheduleResult">
                <p>Add your subjects and click Generate to see your plan.</p>
            </div>

        </section>

    </main>

    <script src="../js/study-plan.js"></script>

</body>
</html>
