<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1764a3">

    <title>AI Chat - Academic AI Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <div class="logo">
            Academic AI Assistant
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="chat.html" class="active">Chat</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="gpa.html">GPA</a></li>
            <li><a href="study-plan.html">Study Plan</a></li>
        </ul>
    </nav>

    <main class="chat-page">

        <h1>AI Study Assistant</h1>

        <p class="chat-description">
            Ask questions about your course syllabus and get
            grounded academic answers.
        </p>

        <div class="chat-container">

            <div class="chat-messages">

                <div class="message assistant-message">
                    Hello! I'm your Academic AI Assistant.
                    Ask me anything about your course syllabus.
                </div>

            </div>

            <div class="chat-input-area">

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask a question about your course..."
                >

                <button id="send-button">
                    Send
                </button>

            </div>

        </div>

    </main>
    <script src="../js/chat.js"></script>
</body>

</html>
