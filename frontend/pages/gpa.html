<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1764a3">

    <title>GPA Calculator - Academic AI Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <div class="logo">
            Academic AI Assistant
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="gpa.html" class="active">GPA</a></li>
            <li><a href="study-plan.html">Study Plan</a></li>
        </ul>
    </nav>

    <main class="page-container">

        <section class="page-header">

            <h1>GPA Simulator</h1>

            <p>
                Add your courses, grades, and credit hours to calculate
                your GPA.
            </p>

        </section>

        <section class="gpa-card">

            <h2>Add Course</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label for="courseName">
                        Course Name
                    </label>

                    <input
                        type="text"
                        id="courseName"
                        placeholder="Example: Artificial Intelligence"
                    >

                </div>

                <div class="form-group">

                    <label for="creditHours">
                        Credit Hours
                    </label>

                    <input
                        type="number"
                        id="creditHours"
                        min="1"
                        max="10"
                        placeholder="3"
                    >

                </div>

                <div class="form-group">

                    <label for="grade">
                        Grade
                    </label>

                    <select id="grade">

                        <option value="">Select Grade</option>

                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="C-">C-</option>
                        <option value="D+">D+</option>
                        <option value="D">D</option>
                        <option value="F">F</option>

                    </select>

                </div>

            </div>

            <button
                type="button"
                id="addCourseButton"
                class="primary-button"
            >
                Add Course
            </button>

        </section>

        <section class="courses-card">

            <h2>Your Courses</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Course</th>
                            <th>Credits</th>
                            <th>Grade</th>
                            <th>Points</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="courseTable">

                    </tbody>

                </table>

            </div>

        </section>

        <section class="gpa-result">

            <h2>Current GPA</h2>

            <div id="gpaValue">
                0.00
            </div>

            <p>
                Add courses to calculate your GPA.
            </p>

        </section>

    </main>

    <script src="../js/gpa.js"></script>

</body>
</html>
